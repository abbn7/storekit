name: StoreKit production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: storekit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck storefront
        run: pnpm --filter @workspace/storekit typecheck

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Build storefront
        run: pnpm --filter @workspace/storekit build

      - name: Build API
        run: pnpm --filter @workspace/api-server build
